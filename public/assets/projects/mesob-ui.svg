<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="225" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.1" stroke="#22d3ee" stroke-width="0.5">
    <line x1="0" y1="45" x2="400" y2="45"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="135" x2="400" y2="135"/>
    <line x1="0" y1="180" x2="400" y2="180"/>
    <line x1="80" y1="0" x2="80" y2="225"/>
    <line x1="160" y1="0" x2="160" y2="225"/>
    <line x1="240" y1="0" x2="240" y2="225"/>
    <line x1="320" y1="0" x2="320" y2="225"/>
  </g>
  <!-- UI Component representations -->
  <g transform="translate(30, 50)">
    <!-- Button component -->
    <rect x="0" y="0" width="100" height="36" rx="6" fill="#22d3ee" opacity="0.9"/>
    <text x="50" y="23" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="600" text-anchor="middle">Button</text>
  </g>
  <g transform="translate(145, 50)">
    <!-- Input component -->
    <rect x="0" y="0" width="120" height="36" rx="6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="12" y="23" fill="#64748b" font-family="system-ui" font-size="12">Input field...</text>
  </g>
  <g transform="translate(280, 50)">
    <!-- Toggle component -->
    <rect x="0" y="8" width="44" height="24" rx="12" fill="#8b5cf6"/>
    <circle cx="32" cy="20" r="9" fill="white"/>
  </g>
  <g transform="translate(30, 110)">
    <!-- Card component -->
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="12" y="12" width="60" height="8" rx="2" fill="#475569"/>
    <rect x="12" y="28" width="126" height="6" rx="2" fill="#334155"/>
    <rect x="12" y="40" width="100" height="6" rx="2" fill="#334155"/>
    <rect x="12" y="58" width="70" height="14" rx="4" fill="#22d3ee" opacity="0.3"/>
  </g>
  <g transform="translate(200, 110)">
    <!-- Badge/Chip components -->
    <rect x="0" y="0" width="60" height="24" rx="12" fill="#22d3ee" opacity="0.2" stroke="#22d3ee" stroke-width="1"/>
    <text x="30" y="16" fill="#22d3ee" font-family="system-ui" font-size="10" text-anchor="middle">React</text>
    <rect x="70" y="0" width="50" height="24" rx="12" fill="#8b5cf6" opacity="0.2" stroke="#8b5cf6" stroke-width="1"/>
    <text x="95" y="16" fill="#8b5cf6" font-family="system-ui" font-size="10" text-anchor="middle">npm</text>
    <rect x="0" y="35" width="80" height="24" rx="12" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="51" fill="#10b981" font-family="system-ui" font-size="10" text-anchor="middle">TypeScript</text>
  </g>
  <!-- Mesob UI text -->
  <text x="200" y="210" fill="url(#accent)" font-family="system-ui" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.05em">@mesob/ui</text>
</svg>
